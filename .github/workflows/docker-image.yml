name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CPP_IMAGE_VERSION: 2.0.0
      GO_IMAGE_VERSION: 2.0.0
      STM32_IMAGE_VERSION: 1.0.0

    steps:
    - uses: actions/checkout@v5
    - name: docker login
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
    - name: Build the base Docker
      working-directory: ./dockerfiles/base
      run: docker build . --file Dockerfile --tag ghcr.io/graugans/base
    - name: docker push base
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: docker push ghcr.io/graugans/base
    - name: Build the base C++ Docker
      working-directory: ./dockerfiles/cpp_base
      run: |
        docker build . --file Dockerfile \
          --tag ghcr.io/graugans/cpp \
          --tag ghcr.io/graugans/cpp:${CPP_IMAGE_VERSION}
    - name: Build the base Go Docker
      working-directory: ./dockerfiles/golang
      run: |
        docker build . --file Dockerfile \
          --tag ghcr.io/graugans/golang \
          --tag ghcr.io/graugans/golang:${GO_IMAGE_VERSION} 
    - name: Build the Asciidoctor Docker
      working-directory: ./dockerfiles/asciidoctor
      run: |
        docker build . --file Dockerfile \
          --tag ghcr.io/graugans/asciidoctor
    - name: Build the STM32F103 Docker
      working-directory: ./dockerfiles/stm32f103
      run: |
        docker build . --file Dockerfile \
          --build-arg CPP_IMAGE_VERSION=${CPP_IMAGE_VERSION} \
          --tag ghcr.io/graugans/stm32f103 \
          --tag ghcr.io/graugans/stm32f103:${STM32_IMAGE_VERSION}
    - name: docker push cpp base
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/graugans/cpp
        docker push ghcr.io/graugans/cpp:${CPP_IMAGE_VERSION}
    - name: docker push Go
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/graugans/golang
        docker push ghcr.io/graugans/golang:${GO_IMAGE_VERSION}
    - name: docker push Asciidoctor
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: docker push ghcr.io/graugans/asciidoctor
    - name: docker push STM32F103
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        docker push ghcr.io/graugans/stm32f103
        docker push ghcr.io/graugans/stm32f103:${STM32_IMAGE_VERSION}